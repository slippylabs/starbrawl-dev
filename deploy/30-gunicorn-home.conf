# gunicorn >=26 opens a control socket at $HOME/.gunicorn/gunicorn.ctl, which
# ProtectSystem=strict makes unwritable, so the master logged
#   Control server error: [Errno 30] Read-only file system
# on every start. Harmless -- workers boot and serve -- but it buried real errors.
#
# RuntimeDirectory= gives a tmpfs dir owned by User=/Group= that systemd also
# marks writable through ProtectSystem=strict and removes on stop -- the right
# home for a runtime socket. Unlike the usermod -d approach it needs no passwd
# change and no stop-first dance, so a plain restart picks it up.
[Service]
RuntimeDirectory=starbrawl
Environment=HOME=/run/starbrawl
